services:
  db:
    image: postgres:17
    container_name: agritrack-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: agritrack
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: agritrack
    ports:
      - "5432:5432"
    volumes:
      - agritrack-data:/var/lib/postgresql/data

volumes:
  agritrack-data:
    name: agritrack-data